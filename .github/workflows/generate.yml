name: Add new junk items (weekly)

# 毎週 Gemini で新規10件を生成 -> data/zukan.db をコミット -> Cloudflare Pages が自動再ビルド
on:
  schedule:
    - cron: "0 18 * * 0" # 毎週月曜 03:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install google-genai pydantic httpx python-dotenv
      - name: Seed if DB missing
        run: test -f data/zukan.db || python pipeline/src/seed.py
      - name: Generate new items
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: python pipeline/src/generator.py
      - name: Sync existing items with Rakuten API (if configured)
        if: ${{ secrets.RAKUTEN_APP_ID != '' }}
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        run: python pipeline/src/rakuten_sync.py --only-missing
      - name: Commit DB
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f data/zukan.db
          git diff --cached --quiet || (git commit -m "chore: add new items" && git push)

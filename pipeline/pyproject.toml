[project]
name = "junk-price-pipeline"
version = "0.1.0"
description = "JunkPrice Battle data pipeline (seed / Gemini generator / legal image fetcher)"
# seed.py / db.py / image_fetcher.py は標準ライブラリのみでも動作（Python 3.7+）。
# generator.py (google-genai) は Python 3.9+ が必要です。
requires-python = ">=3.9"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
